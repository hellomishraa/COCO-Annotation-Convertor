name: Suspend Render service for weekend
on:
  push:
    branches:
      - main
  schedule:
    # Sat 00:00 IST = Fri 18:30 UTC
    - cron: "30 18 * * 5"
  workflow_dispatch: {}

jobs:
  suspend:
    runs-on: ubuntu-latest
    steps:
      - name: Suspend service
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_BACKEND_ANNOTATION_CONVERTOR }}/suspend" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"